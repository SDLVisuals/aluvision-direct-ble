<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#181918">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aluvision">
  <title>Aluvision Lighting Control</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/aluvision-logo.png">
  <link rel="apple-touch-icon" href="assets/aluvision-app-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" type="button" data-action="go-home" aria-label="Naar Home">
        <img class="brand" src="assets/aluvision-logo.png" alt="Aluvision">
      </button>
      <button id="locationButton" class="location-button" type="button" data-action="locations">
        <span class="location-pin" aria-hidden="true">◆</span>
        <span><small>ACTIEVE LOCATIE</small><b id="locationName">Hoofdlocatie</b></span>
        <i aria-hidden="true">⌄</i>
      </button>
      <button id="connectionBadge" class="connection-badge" type="button" data-action="go-receivers">
        <i></i><span>Geen receiver live</span>
      </button>
    </header>

    <main id="appMain" tabindex="-1"></main>
  </div>

  <nav id="bottomNav" class="bottom-nav" aria-label="Hoofdnavigatie">
    <button type="button" data-page="home"><i>⌂</i><span>Home</span></button>
    <button type="button" data-page="zones"><i>▦</i><span>Zones</span></button>
    <button type="button" data-page="scenes"><i>◇</i><span>Scènes</span></button>
    <button type="button" data-page="presets"><i>☆</i><span>Presets</span></button>
    <button type="button" data-page="receivers"><i>◆</i><span>Receivers</span></button>
    <button type="button" data-page="more"><i>•••</i><span>Meer</span></button>
  </nav>

  <div id="modalLayer" class="modal-layer" hidden>
    <button class="modal-backdrop" type="button" data-action="close-modal" aria-label="Sluiten"></button>
    <section id="modalBody" class="modal-sheet" role="dialog" aria-modal="true" aria-live="polite"></section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="busyOverlay" class="busy-overlay" hidden>
    <div class="spinner"></div>
    <b id="busyText">Even geduld…</b>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
