name: Publish Aluvision GitHub Pages

'on':
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public website
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify demo and APK before publication
        run: |
          node -e '
          const fs=require("node:fs"),path=require("node:path"),crypto=require("node:crypto"),assert=require("node:assert/strict");
          const root="demo",manifest=JSON.parse(fs.readFileSync(path.join(root,"release-info.json")));
          const sha=b=>crypto.createHash("sha256").update(b).digest("hex");
          for(const item of manifest.assets){assert(!path.isAbsolute(item.path)&&!item.path.split("/").includes(".."));assert.equal(sha(fs.readFileSync(path.join(root,item.path))),item.sha256,item.path);}
          const apk=manifest.androidTestApp,bytes=fs.readFileSync(path.join(root,apk.path));
          assert.equal(bytes.length,apk.size);assert.equal(sha(bytes),apk.sha256);
          assert.equal(manifest.hardwareAccess,false);assert.equal(typeof apk.installedVerified,"boolean");
          console.log("Verified "+manifest.assets.length+" demo assets and the exact signed APK bytes.");
          '

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload public website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
