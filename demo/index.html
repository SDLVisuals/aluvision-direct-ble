<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <title>Aluvision Lighting · demo</title>
  <link rel="icon" href="favicon.png">
  <!-- Web-demo (tools/test/flutter-web/demo-bouw.sh): de opbouw van de telefoon. Onderaan de WebApp (iframe), erboven Flutter,
       erover het startbeeld van V30FlutterHost.showStart. Alle adressen zijn relatief: dezelfde map werkt op elk pad. -->
  <style>
    :root{--start-achter:#ECEEF4;--start-logo:#1C1C1E;--start-tekst:#646B75;color-scheme:light dark}
    @media (prefers-color-scheme:dark){:root{--start-achter:#0A0A0D;--start-logo:#FFFFFF;--start-tekst:#9AA1AB}}
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--start-achter)}
    #toestel{position:fixed;inset:0;overflow:hidden}
    #toestel>*{position:absolute;inset:0;width:100%;height:100%;margin:0;border:0;box-sizing:border-box}
    #webapp{z-index:0;display:block;background:transparent}
    /* nooit display:none: dan heeft het Flutter-beeld geen grootte meer */
    #flutter-laag{z-index:1;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s linear .2s}
    #flutter-laag.zichtbaar{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s,visibility 0s}
    #startbeeld{z-index:2;background:var(--start-achter);transition:opacity .2s}
    #startbeeld.weg{opacity:0}
    #startbeeld .logo{position:absolute;left:50%;top:50%;width:193px;height:64px;transform:translate(-50%,calc(-50% - 20px));background:var(--start-logo);
      -webkit-mask:url(webapp/demo/assets/aluvision-logo.png) center/contain no-repeat;mask:url(webapp/demo/assets/aluvision-logo.png) center/contain no-repeat}
    #startbeeld .lighting{position:absolute;left:calc(50% + 3px);top:calc(50% + 22px);transform:translateX(-50%);margin:0;white-space:nowrap;
      font:900 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;letter-spacing:6px;color:var(--start-tekst)}
  </style>
</head>
<body>
  <div id="toestel">
    <iframe id="webapp" title="Aluvision Lighting" allow="clipboard-write; web-share"></iframe>
    <div id="flutter-laag"></div>
    <div id="startbeeld" aria-hidden="true"><div class="logo"></div><p class="lighting">LIGHTING</p></div>
  </div>
  <script src="web-gastheer.js?v=69bf6dbc983816a7"></script>
  <script src="flutter_bootstrap.js?v=7fc1f80b0f81c28d" async></script>
</body>
</html>
